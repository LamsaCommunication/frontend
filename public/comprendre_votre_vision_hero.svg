  <!-- Ear canal inner curve -->
  <path d="M325 178 Q310 200 322 222 Q330 235 340 230 Q350 225 352 212 Q354 200 345 195 Q336 190 335 200 Q334 208 340 210" fill="none" stroke="#534AB7" stroke-width="2" stroke-linecap="round" style="fill:none;stroke:rgb(83, 74, 183);color:rgb(255, 255, 255);stroke-width:2px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

